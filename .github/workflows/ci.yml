name: Petclinic CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  permissions:
    contents: read
    packages: write
jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Give permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw test

      - name: Build application
        run: ./mvnw package -DskipTests
      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: petclinic-jars
          path: |
            spring-petclinic-*/target/*.jar
          if-no-files-found: error
          retention-days: 1

  docker-build:
    name: Build Docker - ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: build-and-test

    strategy:
      fail-fast: false

      matrix:
        service:
          - name: admin-server
            artifact: spring-petclinic-admin-server/target/spring-petclinic-admin-server-4.0.1
            port: 9090

          - name: api-gateway
            artifact: spring-petclinic-api-gateway/target/spring-petclinic-api-gateway-4.0.1
            port: 8080

          - name: config-server
            artifact: spring-petclinic-config-server/target/spring-petclinic-config-server-4.0.1
            port: 8888

          - name: customers-service
            artifact: spring-petclinic-customers-service/target/spring-petclinic-customers-service-4.0.1
            port: 8081

          - name: discovery-server
            artifact: spring-petclinic-discovery-server/target/spring-petclinic-discovery-server-4.0.1
            port: 8761

          - name: genai-service
            artifact: spring-petclinic-genai-service/target/spring-petclinic-genai-service-4.0.1
            port: 8084

          - name: vets-service
            artifact: spring-petclinic-vets-service/target/spring-petclinic-vets-service-4.0.1
            port: 8083

          - name: visits-service
            artifact: spring-petclinic-visits-service/target/spring-petclinic-visits-service-4.0.1
            port: 8082

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download JAR artifacts
        uses: actions/download-artifact@v4
        with:
          name: petclinic-jars
          path: .

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/petclinic-${{ matrix.service.name }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ARTIFACT_NAME=${{ matrix.service.artifact }}
            EXPOSED_PORT=${{ matrix.service.port }}
